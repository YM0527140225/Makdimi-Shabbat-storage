<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ממיר שקיעות למקטע נתונים מותאם</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        input[type="file"] {
            margin: 20px 0;
            font-size: 16px;
            max-width: 100%;
        }
        .btn-process {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
        }
        .btn-process:hover {
            background-color: #0056b3;
        }
        .download-btn {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: block;
            text-decoration: none;
        }
        .download-btn:hover {
            background-color: #e67e22;
        }
        #status {
            font-weight: bold;
            color: #0056b3;
            margin-bottom: 15px;
        }
        #log {
            font-size: 14px;
            color: #555;
            text-align: right;
            margin-bottom: 15px;
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        #download-list {
            text-align: right;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>המרת שקיעות (שם עיר נקי בהתחלה)</h2>
    <p>העלה קובץ <b>Excel (.xlsx)</b>. המערכת תייצר קובץ שבו השורה הראשונה היא רק <b>שם העיר</b> ללא מרכאות, ללא נקודתיים וללא סוגריים.</p>
    
    <input type="file" id="fileInput" multiple accept=".xlsx, .xls" />
    <br>
    <button class="btn-process" onclick="processFiles()">1. עבד קבצים</button>
    
    <p id="status"></p>
    <div id="log"></div>
    <div id="download-list"></div>
</div>

<script>
    async function processFiles() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const downloadList = document.getElementById('download-list');
        const logBox = document.getElementById('log');
        const files = fileInput.files;

        if (files.length === 0) {
            status.innerText = "אנא בחר קבצי אקסל (.xlsx) קודם!";
            status.style.color = "red";
            return;
        }

        status.style.color = "#0056b3";
        status.innerText = "קורא ומעבד את הנתונים...";
        downloadList.innerHTML = "";
        logBox.innerHTML = "<b>יומן עיבוד:</b><br>";
        logBox.style.display = "block";

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            
            const data = await readFileAsArrayBuffer(file);
            const workbook = XLSX.read(data, { type: 'array', raw: false });
            
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
            
            if (rows.length < 2) continue;

            // חילוץ שם העיר מהתא הראשון
            let rawCityName = String(rows[0][0] || "").replace(/['",]/g, '').trim();
            if (!rawCityName) {
                rawCityName = file.name.replace('.xlsx', '');
            }

            // חילוץ מערך הזמנים (Offsets) מהתא השני
            let rawOffsets = String(rows[0][1] || "");
            let offsetArray = [];
            if (rawOffsets) {
                offsetArray = rawOffsets.replace(/['"]/g, '').split(',')
                                        .map(n => parseInt(n.trim()))
                                        .filter(n => !isNaN(n));
            }

            // סריקה לזיהוי טווח שעון קיץ לפי קפיצות
            let parsedRows = [];
            let prevMins = -1;
            let dstStartIndex = -1;
            let dstEndIndex = -1;

            for (let j = 1; j < rows.length; j++) {
                let row = rows[j];
                if (!row || row.length === 0) continue;

                let col1 = row[0] !== undefined ? String(row[0]).trim() : "";
                let col2 = row[1] !== undefined ? String(row[1]).trim() : "";
                
                let isDateRow = col1.includes('.') && col2.includes(':');
                
                let mins = -1;
                if (isDateRow) {
                    let parts = col2.split(':');
                    let h = parseInt(parts[0], 10);
                    let m = parseInt(parts[1], 10);
                    mins = (h * 60) + m;

                    if (prevMins !== -1) {
                        let diff = mins - prevMins;
                        if (diff > 45) {
                            dstStartIndex = j; 
                        } else if (diff < -45) {
                            dstEndIndex = j; 
                        }
                    }
                    prevMins = mins;
                }
                
                parsedRows[j] = { isDate: isDateRow, col1: col1, col2: col2 };
            }

            logBox.innerHTML += `&bull; ${rawCityName}: מעובד כעת.<br>`;

            // בניית אובייקט השקיעות
            let sunsetsData = {};

            for (let j = 1; j < parsedRows.length; j++) {
                let item = parsedRows[j];
                if (!item || !item.isDate) continue;

                let inDst = false;
                if (dstStartIndex !== -1 && dstEndIndex !== -1) {
                    if (j >= dstStartIndex && j < dstEndIndex) {
                        inDst = true;
                    }
                }

                // סידור התאריך: "1.1." ל-"1.1"
                let dateParts = item.col1.split('.');
                let cleanDate = `${dateParts[0]}.${dateParts[1]}`;

                // חיתוך שניות והפחתת שעה בשעון הקיץ
                let timeParts = item.col2.split(':');
                let h = parseInt(timeParts[0], 10);
                let m = timeParts[1]; 

                if (inDst) {
                    h = h - 1; 
                }
                
                let hStr = h < 10 ? '0' + h : String(h);
                let cleanTime = `${hStr}:${m}`;
                
                sunsetsData[cleanDate] = cleanTime;
            }

            // יצירת האובייקט הפנימי
            let innerObject = {
                abroad: false,
                offsets: offsetArray,
                sunsets: sunsetsData,
                id: rawCityName
            };

            // הפיכת האובייקט הפנימי לטקסט מעוצב
            let innerJson = JSON.stringify(innerObject, null, 2);
            
            // המחיקה החכמה: חותך את הסוגר המסולסל הראשי הפותח של הקובץ 
            // ומקפיץ את התוכן למעלה
            innerJson = innerJson.replace(/^\{\s*/, '');
            
            // בניית המחרוזת כשהשורה הראשונה היא רק שם העיר (נקייה לחלוטין)
            const customJsonString = `${rawCityName}\n  ${innerJson}`;

            // העברת המחרוזת הידנית לפונקציית ההורדה (כקובץ json או txt לפי הצורך)
            createJsonDownloadButton(customJsonString, `${rawCityName}.json`, rawCityName, downloadList);
        }

        status.innerText = "העיבוד הסתיים בהצלחה!";
        status.style.color = "green";
    }

    // פונקציה שמורידה את המחרוזת המעוצבת
    function createJsonDownloadButton(rawStringData, filename, cityName, container) {
        const btn = document.createElement('button');
        btn.className = 'download-btn';
        btn.innerText = `⬇️ הורד נתונים - ${cityName}`;
        
        btn.onclick = function() {
            const blob = new Blob([rawStringData], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };
        
        container.appendChild(btn);
    }

    function readFileAsArrayBuffer(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(e);
            reader.readAsArrayBuffer(file);
        });
    }
</script>

</body>
</html>
